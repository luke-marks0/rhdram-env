name: phase0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout event commit
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - name: Show Python
        run: python3 --version

      - name: Verify Phase 0 gate
        run: python3 scripts/verify_phase0.py

      - name: Run Phase 0 tests
        run: python3 -m pytest tests/phase0

