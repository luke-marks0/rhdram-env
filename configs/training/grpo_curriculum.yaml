# Discovery curriculum + bounded probe shaping — instance-only training run.
#
# Trains a policy that *discovers* RowHammer adjacency (Tier 2a/2b) rather than
# reciting a disclosed hint. Orders the task families by increasing difficulty and
# turns on the bounded reward shaping term that makes the sparse discovery reward
# learnable in practice.
#
#   python3 -B scripts/train_grpo.py --config configs/training/grpo_curriculum.yaml
#
# GATE: before spending any instance time, the reference policy must clear every
# stage's `reference_min_success` on the host (no torch):
#
#   python3 -m unittest tests.test_curriculum
#
# Re-run after any curriculum edit — a band the deterministic reference can't solve
# within budget will never be solved by GRPO either.

model:
  name: Qwen/Qwen3-8B
  enable_thinking: false
  torch_dtype: bfloat16
  #attn_implementation: flash_attention_2

peft:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

env:
  launch_server: true
  server_host: 127.0.0.1
  server_mode: production
  max_concurrent_envs: 16
  concurrency: 16
  max_steps: 4                # single-shot fallback cap; multi-turn uses rollout.max_turns

prompt:
  hint_level: none # full | geometry | none

rollout:
  multi_turn: true
  max_turns: 200
  max_prompt_tokens: 2048
  # max_turn_tokens: 1024

curriculum:
  - name: tier0_known_target
    tier: tier0
    band: ""
    tasks: [configs/tasks/known_target_anybit.yaml]
    seed_range: [1, 64]
    multi_turn: true
    reference_min_success: 1.0        # the reference hammer saturates known-target

  - name: tier2a_bounded_sweep_easy
    tier: tier2a
    band: easy
    tasks: [configs/tasks/bounded_sweep_easy.yaml]
    seed_range: [1, 256]
    multi_turn: true
    reference_min_success: 1.0

  - name: tier2a_bounded_sweep_medium
    tier: tier2a
    band: medium
    tasks: [configs/tasks/bounded_sweep_medium.yaml]
    seed_range: [1, 256]
    multi_turn: true
    reference_min_success: 1.0

  - name: tier2a_bounded_sweep_hard
    tier: tier2a
    band: hard
    tasks: [configs/tasks/bounded_sweep_hard.yaml]
    seed_range: [1, 128]
    multi_turn: true
    reference_min_success: 1.0

  - name: tier2b_hidden_adjacency_easy
    tier: tier2b
    band: easy
    tasks: [configs/tasks/hidden_adjacency_easy.yaml]
    seed_range: [1, 256]
    multi_turn: true
    reference_min_success: 1.0

  - name: tier2b_hidden_adjacency_medium
    tier: tier2b
    band: medium
    tasks: [configs/tasks/hidden_adjacency_medium.yaml]
    seed_range: [1, 256]
    multi_turn: true
    reference_min_success: 1.0

  - name: tier2b_hidden_adjacency_hard
    tier: tier2b
    band: hard
    tasks: [configs/tasks/hidden_adjacency_hard.yaml]
    seed_range: [1, 128]
    multi_turn: true
    reference_min_success: 1.0

# Held-out seeds for eval-during-training, disjoint from the training ranges above so
# eval reward measures generalization. Applied to whichever stage is being trained.
eval:
  seed_range: [10000, 10031]

reward:
  success_weight: 1.0
  probe_shaping_weight: 0.2

wandb:
  enabled: true
  project: rowhammer-grpo
  run_name: qwen3-8b-discovery-curriculum
  num_completions_to_print: 8
  max_table_rows: 32

grpo:
  output_dir: runs/grpo_curriculum
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  beta: 0.0
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  max_steps: 400
  max_prompt_length: 2048         # discovery prompts disclose the candidate window
  max_completion_length: 256
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 50
  report_to: none
  seed: 42
  log_completions: false
  use_vllm: false
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
