# Tiny multi-turn GRPO smoke (P27 Done-when #3) — instance-only (needs torch/trl/GPU).
#
# Proves the multi-turn training path produces a non-trivial gradient/advantage signal
# end-to-end: a small model runs REAL turn-by-turn discovery episodes (probe -> timing
# digest -> narrow -> hammer) against the live OpenEnv server, trajectories are masked to
# assistant spans, and GRPO updates on the trusted sparse reward. Not a full run — a
# handful of steps on a small model to confirm the wiring is alive.
#
#   python3 -B scripts/train_grpo.py --config configs/training/grpo_smoke_multiturn.yaml
#
# Prereqs on the instance: worker built (scripts/build_phase2.py), and BOTH
# requirements.txt (server: fastapi/uvicorn/websockets) and requirements-train.txt
# (torch/trl/transformers/peft/accelerate) installed.

model:
  name: Qwen/Qwen3-1.7B          # small enough for a quick smoke; any HF causal-LM works
  enable_thinking: false
  torch_dtype: bfloat16
  # attn_implementation: flash_attention_2   # only if flash-attn is installed

peft:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

env:
  launch_server: true
  server_host: 127.0.0.1
  server_mode: production
  max_concurrent_envs: 4
  concurrency: 4

# Multi-turn ON. The trainer FAILS CLOSED if the installed TRL has no
# GRPOTrainer(rollout_func=...) hook — that is the capability you are confirming.
rollout:
  multi_turn: true
  max_turns: 48                 # bounded_sweep_easy solves in ~10 turns; headroom only

# Discovery family that actually NEEDS multi-turn (a single disclosed HAMMER can't solve
# it). The P26 reference policy already proves it's solvable within budget.
tasks:
  - config: configs/tasks/bounded_sweep_easy.yaml
seeds: [1, 2, 3, 4]

reward:
  success_weight: 1.0           # trusted sparse episode reward (real flip => 1.0)

wandb:
  enabled: false                # keep the smoke self-contained; flip on for a real run

grpo:
  output_dir: runs/grpo_smoke_multiturn
  learning_rate: 1.0e-5
  beta: 0.0
  num_generations: 4            # the GRPO group; needs reward variance within a group
  per_device_train_batch_size: 4   # must be divisible by num_generations
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  max_steps: 5                  # a few optimizer steps is enough to see a gradient
  max_prompt_length: 1536
  max_completion_length: 256    # per-turn completion cap (one tool call fits easily)
  temperature: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: none
  seed: 42
  # NOTE: with a custom rollout_func, generation happens in HFCompletionGenerator, not
  # TRL's own vLLM path — so use_vllm is intentionally omitted (left off) here.
