# Multi-turn GRPO FRONTIER smoke (P27 Done-when #3, the grad_norm>0 demo) — instance-only.
#
# grpo_smoke_multiturn_known.yaml proved the pipeline + clean generation + trusted reward
# (a capable model solves known-target every time -> reward 1.0, but reward_std=0 so
# grad_norm=0). grpo_smoke_multiturn.yaml is the other endpoint (discovery -> reward 0,
# grad_norm=0). BOTH zero-gradient results are correct GRPO behavior: no within-group
# reward variance => no advantage => no gradient.
#
# This config forces WITHIN-GROUP VARIANCE so grad_norm>0: a WEAKER model at HIGHER
# temperature on the easy known-target task succeeds only *some* of the time, so a GRPO
# group of 8 gets a mix of 1.0/0.0 -> non-zero reward_std -> non-zero advantage/gradient.
#
#   python3 -B scripts/train_grpo.py --config configs/training/grpo_smoke_multiturn_frontier.yaml
#
# TUNING (this is P28 band-calibration in miniature): watch rewards/env_success_multiturn/
# mean. If it's ~1.0 (too easy), raise temperature or drop to a smaller model; if ~0.0
# (too hard), lower temperature. You want it roughly 0.3-0.7 so std>0 shows up. When it
# does, grad_norm goes positive on those steps — that's the signal.

model:
  name: Qwen/Qwen3-1.7B          # weaker policy => imperfect => success/fail mix
  enable_thinking: false
  torch_dtype: bfloat16

peft:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

env:
  launch_server: true
  server_host: 127.0.0.1
  server_mode: production
  max_concurrent_envs: 4
  concurrency: 4

rollout:
  multi_turn: true
  max_turns: 4

tasks:
  - config: configs/tasks/known_target_anybit.yaml
seeds: [1, 2, 3, 4]

reward:
  success_weight: 1.0

wandb:
  enabled: false

grpo:
  output_dir: runs/grpo_smoke_multiturn_frontier
  learning_rate: 1.0e-5
  beta: 0.0
  num_generations: 8            # 8 samples/group => a mix is likely once success is ~50%
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  max_steps: 6
  max_completion_length: 384
  temperature: 1.5              # hot enough that the weak model sometimes botches the HAMMER
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: none
  seed: 42
