# Multi-turn GRPO GRADIENT-PATH smoke (P27 Done-when #3) — instance-only.
#
# Companion to grpo_smoke_multiturn.yaml. That one proves the multi-turn plumbing runs
# end-to-end; an untrained model scores 0 on the DISCOVERY family, so reward_std=0 and
# grad_norm=0 (expected — no within-group reward variance to learn from).
#
# This one isolates the GRADIENT PATH: a KNOWN-TARGET family discloses the exact
# aggressor rows + threshold in the prompt, so even a weak base model sometimes emits a
# working HAMMER and sometimes doesn't -> non-zero reward_std within the GRPO group ->
# non-zero advantage -> non-zero grad_norm, proving the multi-turn trajectory + trusted
# reward drive a real gradient. (Getting that variance on the DISCOVERY families is P28:
# a discovery-oriented prompt + curriculum + a more capable policy.)
#
#   python3 -B scripts/train_grpo.py --config configs/training/grpo_smoke_multiturn_known.yaml
#
# WATCH FOR: rewards/env_success_multiturn/mean > 0, reward_std > 0 on at least one step,
# frac_reward_zero_std < 1.0, and grad_norm > 0.

model:
  name: Qwen/Qwen3-4B-Instruct-2507   # instruct model emits clean, terminating tool JSON
  enable_thinking: false
  torch_dtype: bfloat16

peft:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

env:
  launch_server: true
  server_host: 127.0.0.1
  server_mode: production
  max_concurrent_envs: 4
  concurrency: 4

rollout:
  multi_turn: true
  max_turns: 4                  # known-target solves in one HAMMER; small cap is plenty

# Tier 0 known-target: the prompt discloses the physical aggressors + known_threshold,
# so a valid single HAMMER earns the trusted reward (the reference hammer saturates it).
tasks:
  - config: configs/tasks/known_target_anybit.yaml
seeds: [1, 2, 3, 4, 5, 6, 7, 8]

reward:
  success_weight: 1.0

wandb:
  enabled: false

grpo:
  output_dir: runs/grpo_smoke_multiturn_known
  learning_rate: 1.0e-5
  beta: 0.0
  num_generations: 8            # bigger group => better chance of a success/fail mix
  per_device_train_batch_size: 8   # 1 prompt/device x 8 generations
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  max_steps: 4
  max_completion_length: 384    # room for one clean HAMMER turn without clipping
  temperature: 1.0              # keep exploration high so groups have reward variance
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: none
  seed: 42
